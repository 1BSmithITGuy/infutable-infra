#  Configure a physical Linux workstation (Fedora or Ubuntu)

#  Collections:
#    ansible-galaxy collection install -r requirements-linux.yml

#  To run by hand, on the workstation:
#    ansible-playbook playbooks/linux/workstation.yml --limit "$(hostname)" -K


---

- name: Configure Linux workstation
  hosts: linux_workstations
  gather_facts: true
  pre_tasks:
    - name: Ensure only the local host is targeted
      ansible.builtin.assert:
        that:
          - ansible_play_hosts | length == 1
          - inventory_hostname == ansible_facts.hostname
        fail_msg: 'Run with --limit "$(hostname)". All hosts use connection: local.'

  roles:
    - role: linux-packages
      tags: [packages]

    - role: flatpak
      tags: [flatpak]

    - role: linux-vscode
      tags: [vscode]

    - role: linux-chrome
      tags: [chrome]
