#  Linux workstation vars

# when adding apps, keep all alphabetical

#  --------- linux-packages role vars: ---------
#  Installed by the distro's package manager (dnf, apt, etc). Names that differ between families are in roles/linux-packages/vars/<os_family>.yml

linux_packages_base:
# (add in alphabetical order)
  - audacity
  - curl
  - efibootmgr
  - flatpak
  - gimp
  - git
  - htop
  - libreoffice
  - nemo
  - nodejs
  - podman
  - remmina
  - rsync
  - syncthing
  - tmux
  - tree
  - wireguard-tools
  - wl-clipboard
  - xclip

#  --------- flatpak role vars: ---------
# Flathub application IDs, identical on every distro.

flatpak_apps:
  - com.jgraph.drawio.desktop
  - com.mattjakeman.ExtensionManager
  - md.obsidian.Obsidian

#  --------- linux-vscode role vars: ---------

vscode_extensions:
  - ms-vscode-remote.remote-ssh
  - ms-vscode-remote.remote-ssh-edit
  - ms-vscode.remote-explorer
  - pkief.material-icon-theme
