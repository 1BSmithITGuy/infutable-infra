#  Installs all specified Linux packages
#    Family specific names are data in vars


---
- name: Load OS family package names
  ansible.builtin.include_vars: "{{ ansible_facts.os_family }}.yml"

- name: Install packages
  ansible.builtin.package:
    name: "{{ linux_packages_base + linux_packages_family }}"
    state: present
  become: true
