#  Installs all packages on workstation
#   -  Family specific names are data in vars


---
- name: Load OS family package names
  ansible.builtin.include_vars: "{{ ansible_facts.os_family }}.yml"

- name: Install workstation packages
  ansible.builtin.package:
    name: "{{ workstation_common_packages + workstation_family_packages }}"
    state: present
  become: true
